name: Release portable Windows build
on:
  push:
    tags: ['v[0-9]*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Select bootstrap Python for the offline OCR runtime builder
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Check tag against project version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $match = Select-String -Path TaskPinQt/CMakeLists.txt -Pattern 'project\(TaskPinQt VERSION ([0-9.]+)'
          $version = $match.Matches[0].Groups[1].Value
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag does not match CMake project version.' }
      - name: Install Qt 6.4.3 and matching MinGW
        uses: jurplel/install-qt-action@v4.5.0
        with:
          version: '6.4.3'
          host: windows
          target: desktop
          arch: win64_mingw
          tools: 'tools_mingw90,qt.tools.win64_mingw900'
          cache: true
      - name: Build Release
        run: |
          $compiler = Join-Path $env:IQTA_TOOLS 'mingw1120_64/bin/g++.exe'
          $version = & $compiler -dumpfullversion -dumpversion
          if ($LASTEXITCODE -ne 0 -or $version -ne '11.2.0') { throw 'Expected MinGW GCC 11.2.0.' }
          ./TaskPinQt/scripts/build.ps1 -QtKit $env:QT_ROOT_DIR -Compiler $compiler
      - name: QtTest and isolated selftest
        run: |
          ./TaskPinQt/scripts/prepare-test-font.ps1
          $env:TASKPIN_TEST_FONT = Join-Path $env:GITHUB_WORKSPACE 'docs/artifacts/fonts/NotoSansCJKsc-Regular.otf'
          ./TaskPinQt/scripts/test.ps1
      - name: Package tested commit and compute checksums
        run: |
          $compiler = Join-Path $env:IQTA_TOOLS 'mingw1120_64/bin/g++.exe'
          ./TaskPinQt/scripts/package.ps1 -QtKit $env:QT_ROOT_DIR -Compiler $compiler
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-test-reports
          if-no-files-found: warn
          path: |
            docs/artifacts/automated/*.txt
            docs/artifacts/automated/*.xml
            docs/artifacts/automated/*.log
      - name: Publish verified release assets
        uses: softprops/action-gh-release@v3.0.4
        with:
          generate_release_notes: true
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            dist/TaskPin-*-windows-x64.zip
            dist/TaskPin-*-source.zip
            dist/SHA256SUMS.txt
